<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen Call Console</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e3e3de; --accent:#1f6f5c; --warn:#a4462a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151514; --card:#1e1e1c; --ink:#ecece8; --muted:#9b9b95; --line:#33332f; --accent:#4fb39a; --warn:#e07a5a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:24px 16px; display:grid; gap:16px; grid-template-columns: 1fr; }
  @media (min-width: 900px) { main { grid-template-columns: 1.3fr 1fr; } .wide { grid-column: 1 / -1; } }
  h1 { font-size:20px; margin:0 0 4px; } h2 { font-size:15px; margin:0 0 10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:500; }
  button { font:inherit; border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:6px; padding:4px 12px; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); }
  button:disabled { opacity:.45; cursor:default; }
  #status { color:var(--muted); margin-bottom:8px; }
  #log { height:360px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
  .msg { padding:6px 10px; border-radius:8px; max-width:90%; }
  .agent { background:color-mix(in srgb, var(--accent) 14%, transparent); align-self:flex-start; }
  .you { background:color-mix(in srgb, var(--muted) 18%, transparent); align-self:flex-end; }
  .muted { color:var(--muted); }
  .yes { color:var(--accent); } .no { color:var(--warn); }
</style>
</head>
<body>
<main>
  <header class="wide">
    <h1>Lumen Finance · EMI reminder calls</h1>
    <div class="muted">Admin places the call; this browser tab is the borrower's phone. Allow the microphone.</div>
  </header>

  <section class="card">
    <h2>Borrowers</h2>
    <table><thead><tr><th>ID</th><th>Name</th><th>Loan</th><th>EMI</th><th>Due</th><th>Status</th><th>Lang</th><th></th></tr></thead>
    <tbody id="borrowers"></tbody></table>
  </section>

  <section class="card">
    <h2>Live call</h2>
    <div id="status">No call in progress.</div>
    <div id="log"></div>
    <div style="margin-top:10px"><button id="hangup" class="ghost" disabled>Hang up</button></div>
  </section>

  <section class="card wide">
    <h2>Call outcomes</h2>
    <table><thead><tr><th>Borrower</th><th>Outcome</th><th>Verified</th><th>Pay date</th><th>Link sent</th><th>Escalate</th><th>Lang</th><th>Notes</th></tr></thead>
    <tbody id="outcomes"></tbody></table>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.23.0/dist/livekit-client.umd.min.js"></script>
<script>
const { Room, RoomEvent, Track } = LivekitClient;
let room = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function say(who, text) {
  const div = document.createElement("div");
  div.className = "msg " + (who === "agent" ? "agent" : "you");
  div.textContent = text;
  $("log").appendChild(div);
  $("log").scrollTop = $("log").scrollHeight;
}

async function loadBorrowers() {
  const rows = await (await fetch("/api/borrowers")).json();
  $("borrowers").innerHTML = rows.map((b) => `<tr><td>${esc(b.id)}</td><td>${esc(b.name)}</td><td>${esc(b.loan_type)}</td>
    <td>${esc(b.emi)}</td><td>${esc(b.due)}</td><td>${esc(b.status)}</td><td>${esc(b.language)}</td>
    <td><button data-id="${esc(b.id)}">Call</button></td></tr>`).join("");
  document.querySelectorAll("#borrowers button").forEach((btn) => btn.onclick = () => placeCall(btn.dataset.id));
}

async function loadOutcomes() {
  const rows = await (await fetch("/api/outcomes")).json();
  const yn = (v) => `<span class="${v ? "yes" : "no"}">${v ? "yes" : "no"}</span>`;
  $("outcomes").innerHTML = rows.map((o) => `<tr><td>${esc(o.borrower_id)}</td><td>${esc(o.outcome)}</td><td>${yn(o.verified)}</td>
    <td>${esc(o.promise_to_pay_date || "")}</td><td>${yn(o.payment_link_sent)}</td><td>${yn(o.escalate_to_human)}</td>
    <td>${esc(o.language)}</td><td style="white-space:normal">${esc(o.notes)}</td></tr>`).join("") || `<tr><td colspan="8" class="muted">No calls yet.</td></tr>`;
}

async function placeCall(borrowerId) {
  if (room) return;
  document.querySelectorAll("#borrowers button").forEach((b) => b.disabled = true);
  $("log").innerHTML = "";
  $("status").textContent = `Calling ${borrowerId}…`;
  const res = await fetch("/api/call", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ borrower_id: borrowerId }) });
  const { url, token, error } = await res.json();
  if (error) { $("status").textContent = error; return endCall(); }

  room = new Room({ adaptiveStream: true });
  room.on(RoomEvent.TrackSubscribed, (track) => {
    if (track.kind === Track.Kind.Audio) document.body.appendChild(track.attach());
  });
  room.on(RoomEvent.ParticipantConnected, () => $("status").textContent = `Connected: ${borrowerId}. Answer as the borrower.`);
  room.on(RoomEvent.Disconnected, endCall);
  // Final transcript segments for both sides, published by the agent.
  room.registerTextStreamHandler("lk.transcription", async (reader, participant) => {
    const text = await reader.readAll();
    if (reader.info.attributes?.["lk.transcription_final"] !== "true" || !text.trim()) return;
    say(participant.identity.startsWith("borrower") ? "you" : "agent", text.trim());
  });
  await room.connect(url, token);
  await room.localParticipant.setMicrophoneEnabled(true);
  $("hangup").disabled = false;
  $("status").textContent = `Ringing ${borrowerId}… the agent will speak first.`;
}

function endCall() {
  if (room) { const r = room; room = null; r.disconnect(); }
  document.querySelectorAll("audio").forEach((a) => a.remove());
  document.querySelectorAll("#borrowers button").forEach((b) => b.disabled = false);
  $("hangup").disabled = true;
  $("status").textContent = "Call ended.";
  setTimeout(loadOutcomes, 3000); // the agent writes the outcome as the room closes
}

$("hangup").onclick = endCall;
loadBorrowers();
loadOutcomes();
</script>
</body>
</html>
